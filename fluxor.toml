# Phasor project configuration. See ../standards/{ci,tests,
# test-tracking,fluxor-modules,dependencies}.md.

[project]
name    = "phasor"
version = "0.0.1"

# Fluxor supplies the module SDK crates (`fluxor-abi`, `fluxor-rt`,
# `fluxor-sdk`, staged under target/fluxor/ by `fluxor sync`) and the host
# runtime through the local OCI store. Phasor does not vendor Fluxor and does
# not publish a sibling runtime.
[dependencies]
fluxor = "0.0.1"

# The stack behind each bound name this project's graphs include. HTTP and
# WebSocket are Wave's, and a store is the deployment's: this project speaks
# the exchange and storage surfaces to whichever stack fills the name, and
# nothing in its own modules depends on any of them. Each is pinned on its
# own, not through a dependency on its publisher.
[uses.stacks]
http_client = "wave_http_client"   # examples/net/https.yaml, the applet
ws_client   = "wave_ws_client"     # the applet
store       = "loam-node"          # examples/capabilities/store-loam.yaml

[ci]
targets = ["rp2350", "bcm2712", "wasm"]

[ci.hygiene]
forbid_inline_tests = ["modules"]
mode                = "strict"

# Every PIC module mounts the engine's shared cores in modules/common whole
# and consumes a subset of them, so each crate root carries one
# `#![allow(dead_code)]` with that reason: an `#[expect]` at every unused item
# of a core another module uses would say less and change more often.
[[ci.hygiene.allow_crate_root]]
prefix = "modules/"
reason = """PIC modules mount the engine's shared cores in modules/common \
whole and consume a subset, so every module's compile sees items it does not \
use."""

# This glob is also the CI materialisation guard: a primary-only checkout has
# no matching script, and the no-vacuous-phase rule fails the gate explicitly.
[ci.test]
scripts = ["tests/e2e/*.sh", "tests/gates/*.sh", "tests/wasm/*.sh", "tests/load/*.sh"]
