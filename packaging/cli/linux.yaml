# The phasor shell as a cli-applet: `fluxor exec phasor -- …`, or `phasor …`
# through the busybox link. One module over the cli stack, with the two
# standard adapters wired to ports of their own. Wiring an adapter grants
# nothing: a binding exists only when `--grant` admits it, and a program with
# no grant has no clock and no randomness.
target: linux
tick_us: 1000

# Each adapter answers the shell on the port it asked from: a cycle by
# construction, and an intended one.
scheduler:
  accept_cycles: true

platform:
  cli: {}
  net: {}

modules:
  - name: phasor_shell
  - name: phasor_time
    params:
      source: unix_ms
  - name: phasor_entropy
    params:
      width: bits53
  - name: phasor_surface
  - name: phasor_store
    params:
      # Where this program's keys live inside whatever store the deployment
      # wired. A program names keys under it and cannot reach outside it.
      namespace: "phasor/"
  # The filesystem the shell can reach is the directory the graph runs in,
  # and nothing above it. Reading is granted; writing is not, until a
  # deployment says so.
  # The stream adapter. `connect` names an authority, `host:port`, and the
  # stack resolves it; `connect()` naming nothing takes this one. `origins`
  # is left unset: `--grant net` admits every authority.
  - name: phasor_net
    params:
      authority: "localhost:8080"
  # HTTP is Wave's, not this project's. The adapter turns a granted call into
  # one exchange record naming the authority the program wrote, and the
  # answer back into a head and a stream; what protocol carried it, and
  # which version, is the provider's business and reaches no program.
  # `origins` is left unset: `--grant http` admits every origin.
  - name: phasor_http
  # Two open clients, one per leg. Neither names an authority: each dials
  # the one the record carries. `https://` goes down the TLS leg and
  # `http://` down the plain one.
  - name: http_tls
    type: http
    variant: exchange
    params:
      mode: 1              # client
      protocol: 0          # HTTP/1.1
  - name: http_plain
    type: http
    variant: exchange
    params:
      mode: 1              # client
      protocol: 0          # HTTP/1.1
  # The TLS leg takes the identity it verifies from each dial it forwards,
  # and asks the PLATFORM whether the chain is good: `trust: system` is the
  # `trust` contract (class 0x1D), where the host applies its own policy --
  # path building, name constraints, EKU, the public root set as the
  # distribution maintains it -- and answers yes or no. No anchors are baked
  # in, so this reaches any origin the host itself would, and a root the
  # distribution withdraws is withdrawn here the same day rather than at the
  # next package build.
  #
  # `--ca <file>` on `fluxor exec` still widens a run for a peer chaining to
  # some other authority. A target with no such provider -- bare metal, wasm
  # -- refuses this at compose rather than at the first handshake.
  - name: tls
    mode: 0
    peer_auth: ca_dns
    trust: system
    clock_policy: require
    alpn_h1_only: 1
    ecdh_bits_per_step: 32
  - name: phasor_fs
    params:
      writable: yes
  # The WebSocket protocol is Wave's, not this project's. This adapter turns a
  # granted call into an open, a frame, or a close; the upgrade and the
  # accept it verifies happen in the provider, which reaches the same
  # endpoint the HTTP one does.
  - name: phasor_ws
    params:
      # What the endpoint is called, so a URL naming another host is refused
      # rather than quietly answered by this one.
      authority: "localhost:8080"
  - name: websocket
    params:
      # The endpoint the graph names and no program can.
      authority: "localhost:8080"

wiring:
  - from: cli_in.args_out
    to: phasor_shell.args
  - from: cli_in.stdin_out
    to: phasor_shell.stdin
  - from: phasor_shell.stdout
    to: cli_out.bytes_in
  - from: phasor_shell.exit
    to: cli_out.exit_in
  - from: phasor_shell.clock_call
    to: phasor_time.request_in
  - from: phasor_time.reply_out
    to: phasor_shell.clock_reply
  - from: phasor_shell.entropy_call
    to: phasor_entropy.request_in
  - from: phasor_entropy.reply_out
    to: phasor_shell.entropy_reply
  - from: phasor_surface.source_out
    to: phasor_shell.surface_in
  - from: phasor_shell.store_call
    to: phasor_store.request_in
  - from: phasor_store.reply_out
    to: phasor_shell.store_reply
  - from: phasor_shell.net_call
    to: phasor_net.request_in
  - from: phasor_net.reply_out
    to: phasor_shell.net_reply
  - from: phasor_net.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: phasor_net.net_in
  - from: phasor_shell.http_call
    to: phasor_http.request_in
  - from: phasor_http.reply_out
    to: phasor_shell.http_reply
  # The request as a record, and the response as a head then a body. Both
  # legs answer on the adapter's one reply pair: one request is in flight
  # at a time, and only the leg it went down has anything to say.
  - from: phasor_http.publish_out
    to: http_tls.publish_in
  - from: http_tls.reply_out
    to: phasor_http.reply_in
  - from: http_tls.file_ctrl
    to: phasor_http.body_in
  - from: http_tls.net_out
    to: tls.clear_in
  - from: tls.clear_out
    to: http_tls.net_in
  - from: tls.cipher_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: tls.cipher_in
  - from: phasor_http.plain_out
    to: http_plain.publish_in
  - from: http_plain.reply_out
    to: phasor_http.reply_in
  - from: http_plain.file_ctrl
    to: phasor_http.body_in
  - from: http_plain.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: http_plain.net_in
  - from: phasor_shell.ws_call
    to: phasor_ws.request_in
  - from: phasor_ws.reply_out
    to: phasor_shell.ws_reply
  # Opens and frames to the provider; what became of a link, and the messages
  # it carried, back.
  - from: phasor_ws.open_out
    to: websocket.open_in
  # A non-zero `buffer_group` puts a channel in mailbox mode, where a write
  # is one whole envelope and a read takes one whole envelope. A `WsFrame` is
  # an envelope, and the default byte FIFO would hand a reader part of one --
  # a length that is not there. Distinct groups for the two directions:
  # sharing one would alias their buffers.
  - from: phasor_ws.frames_out
    to: websocket.ws_in
    buffer_group: 5
  - from: websocket.event_out
    to: phasor_ws.event_in
  - from: websocket.ws_out
    to: phasor_ws.frames_in
    buffer_group: 6
  - from: websocket.net_out
    to: linux_net.net_in
  - from: linux_net.net_out
    to: websocket.net_in
  - from: phasor_shell.fs_call
    to: phasor_fs.request_in
  - from: phasor_fs.reply_out
    to: phasor_shell.fs_reply
