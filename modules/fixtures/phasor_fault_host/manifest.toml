version          = "0.0.1"
hardware_targets = ["bcm2712", "wasm"]

# Call frames a router forwarded.
[[ports]]
name         = "request_in"
direction    = "input"
content_type = "OctetStream"
buffer_size  = 512

# The answers this adapter produces, which a graph chooses by parameter.
[[ports]]
name         = "reply_out"
direction    = "output"
content_type = "OctetStream"
buffer_size  = 512

[observability]
exempt = "fixture adapter whose evidence is the completions it emits"
