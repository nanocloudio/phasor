version = "0.0.1"

# The oracle stages one whole case in module state, so it declares only the
# targets with room for a 32 KiB staging buffer.
hardware_targets = ["bcm2712", "wasm"]

[[ports]]
name         = "cases_in"
direction    = "input"
content_type = "OctetStream"
buffer_size  = 65536

[[ports]]
name         = "report"
direction    = "output"
content_type = "OctetStream"
buffer_size  = 256

[[ports]]
name         = "exit"
index        = 1
direction    = "output"
content_type = "OctetStream"
buffer_size  = 16

[observability]
exempt = "conformance fixture; its report and exit ports are the recorded evidence"
