version          = "0.0.1"
hardware_targets = ["bcm2712", "wasm"]

# A stream of compiled modules: each record is its specifier and its image,
# each with its length in front. The stream ends with a hang-up.
[[ports]]
name         = "unit_in"
direction    = "input"
content_type = "OctetStream"
buffer_size  = 16384

# The linked closure: every module of it, in the order they evaluate.
[[ports]]
name         = "closure_out"
direction    = "output"
content_type = "OctetStream"
buffer_size  = 16384

[[ports]]
name         = "exit"
index        = 1
direction    = "output"
content_type = "OctetStream"
buffer_size  = 16

[observability]
exempt = "stream component whose evidence is the closure it emits and its exit status"
