version          = "0.0.1"
hardware_targets = ["bcm2712", "wasm"]

# Call frames a router or an isolate forwarded, each followed by its payload.
[[ports]]
name         = "request_in"
direction    = "input"
content_type = "OctetStream"
buffer_size  = 8192

# Completion frames, each followed by the bytes it answers with.
[[ports]]
name         = "reply_out"
direction    = "output"
content_type = "OctetStream"
buffer_size  = 8192

[observability]
exempt = "adapter whose evidence is the completions it emits"
