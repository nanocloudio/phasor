version          = "0.0.1"
hardware_targets = ["bcm2712", "wasm"]

# The surface's source, written once and ended by a hang-up. Whatever reads
# it compiles and runs it; nothing here interprets it.
[[ports]]
name         = "source_out"
direction    = "output"
content_type = "TextPlain"
buffer_size  = 65536

[observability]
exempt = "hands over one artefact and completes; its evidence is what reads it"
