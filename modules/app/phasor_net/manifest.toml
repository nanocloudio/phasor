version          = "0.0.1"
hardware_targets = ["bcm2712"]

# Call frames a router or a shell forwarded, each followed by its payload.
[[ports]]
name         = "request_in"
direction    = "input"
content_type = "OctetStream"
buffer_size  = 16384

# Stream-surface events from the network stack.
[[ports]]
name         = "net_in"
index        = 1
direction    = "input"
content_type = "OctetStream"
buffer_size  = 16384

# Completion frames, each followed by the bytes it answers with.
[[ports]]
name         = "reply_out"
direction    = "output"
content_type = "OctetStream"
buffer_size  = 16384

# Stream-surface commands to the network stack. The endpoint they name is the
# one the graph gave this adapter, never one a program asked for.
[[ports]]
name         = "net_out"
index        = 1
direction    = "output"
content_type = "OctetStream"
buffer_size  = 16384

[observability]
exempt = "adapter whose evidence is the completions it emits"
