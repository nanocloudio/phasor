version          = "0.0.1"
type             = "Transformer"
entry            = "mod.rs"
hardware_targets = ["rp2350", "bcm2712", "wasm"]

# One input stream ending in HUP is one seed expression. Reads are staged so
# Fluxor's permitted partial-read behavior cannot truncate an expression.
[[ports]]
name         = "source_in"
direction    = "input"
content_type = "OctetStream"
buffer_size  = 512

[[ports]]
name         = "result_out"
direction    = "output"
content_type = "OctetStream"
buffer_size  = 128

[[ports]]
name         = "exit"
index        = 1
direction    = "output"
content_type = "OctetStream"
buffer_size  = 16

[observability]
metrics = [
    "bytes_in",
    "bytes_out",
    "evaluations",
    "errors",
    "budget_exhausted",
    "bp_steps",
]
